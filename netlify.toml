[build]
  # The directory where Netlify should run the build command
  base = "frontend"

  # The build command to run
  command = "npm run build"

  # The directory containing the built assets that Netlify should publish
  publish = "dist"

# React Router configuration for SPA
# This ensures that all routes (like /menu, /checkout) redirect to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
